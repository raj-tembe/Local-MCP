# Builds standalone Local-MCP binaries for every supported platform and publishes them as a
# GitHub Release when a version tag is pushed:
#
#   npm version 0.2.0        # bumps package.json and creates the v0.2.0 tag
#   git push --follow-tags
#
# A binary only runs on the OS/CPU it was built on, so each target is built on its own runner.
# Actions are pinned to commit SHAs (the comment shows the release they correspond to).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test

  binaries:
    name: Binary (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,    os: ubuntu-latest,    ext: '',     archive: tar.gz }
          - { target: linux-arm64,  os: ubuntu-24.04-arm, ext: '',     archive: tar.gz }
          - { target: darwin-arm64, os: macos-latest,     ext: '',     archive: tar.gz }
          - { target: darwin-x64,   os: macos-15-intel,   ext: '',     archive: tar.gz }
          - { target: win32-x64,    os: windows-latest,   ext: '.exe', archive: zip }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # node-pty is an optional native module that is not bundled into the binary, so install scripts
      # (and the native compile they trigger) are skipped.
      - run: npm ci --ignore-scripts
      - run: npm run build:binary

      - name: Smoke test the binary
        run: node scripts/smoke-binary.mjs "dist-bin/local-mcp-${{ matrix.target }}${{ matrix.ext }}"

      - name: Package
        id: package
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; else version="dev-${GITHUB_SHA::7}"; fi
          name="local-mcp-${version}-${{ matrix.target }}"
          mkdir -p "stage/${name}" release
          cp "dist-bin/local-mcp-${{ matrix.target }}${{ matrix.ext }}" "stage/${name}/local-mcp${{ matrix.ext }}"
          cp LICENSE README.md "stage/${name}/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd stage && powershell -NoProfile -Command "Compress-Archive -Path '${name}' -DestinationPath '../release/${name}.zip'")
            file="release/${name}.zip"
          else
            tar -C stage -czf "release/${name}.tar.gz" "${name}"
            file="release/${name}.tar.gz"
          fi
          if command -v sha256sum >/dev/null 2>&1; then sum=$(sha256sum "$file"); else sum=$(shasum -a 256 "$file"); fi
          # store the checksum with a path-free file name so `sha256sum -c` works after download
          echo "${sum%% *}  $(basename "$file")" > "${file}.sha256"
          ls -la release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: local-mcp-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: local-mcp-*
          path: artifacts
          merge-multiple: true
      - name: Combine checksums
        working-directory: artifacts
        run: |
          cat *.sha256 > SHA256SUMS.txt
          rm -- *.sha256
          sha256sum -c SHA256SUMS.txt
          ls -la
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $flags
