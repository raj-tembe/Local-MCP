name: Feature request
description: Suggest a new tool, option or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Local-MCP lets an AI act on a real machine, so features are weighed against safety as well as usefulness. Describing the problem you are trying to solve helps the most.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not just the solution. For example "I want Claude to be able to ...".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behaviour you have in mind, such as the tool or option name and what it returns.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other tools, configuration or workarounds you tried.
  - type: textarea
    id: safety
    attributes:
      label: Safety and consent
      description: Would this run commands, change files, reach the network or expose data? How should it be gated (approval prompt, allowlist, off by default)?
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this?
      options:
        - Yes, I would like to implement it
        - Yes, with some guidance
        - No, I am just suggesting it
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this has not been requested
          required: true
